
name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Red and Gold Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ABI2006S
          outputs: |
            dist/snake-red-gold.svg?color_snake=#E63946&color_dots=#161B22,#FFF3B0,#FFD700,#F9A602,#B8860B

      - name: Publish Snake
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
