
name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Red & Gold Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ABI2006S
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23E63946&color_dots=%23FFF3B0%2C%23FFD700%2C%23F9A602%2C%23E63946%2C%238B0000
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23E63946&color_dots=%23FFF3B0%2C%23FFD700%2C%23F9A602%2C%23E63946%2C%238B0000

      - name: Push Snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
